[project]
name = "openai-samples-with-lang"
version = "0.1.0"
description = "Small OpenAI, LangChain, and LangGraph examples"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "numexpr>=2.8",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "wikipedia>=1.4",
]

[tool.uv]
package = false
